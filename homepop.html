<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website with Pop-up Message</title>
    
</head>
<body>
    <style>
        /* Style for the pop-up */
.popup {
    display: none;
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}

.popup-content {
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    width: 80%;
    max-width: 400px;
}
h2{
    color:#b76a27;
}
.close-button {
    float: right;
    font-size: 24px;
    cursor: pointer;
}

    </style>
    <div id="popup" class="popup">
        <div class="popup-content">
            <span class="close-button">&times;</span>
            <h2>Thanks for Booking on Hotel Hype!</h2>
            <p>Booking Recipt is sent on you email!</p>
            <p>Check Your Email for downloading recipt pdf</p>
        </div>
    </div>
    
    <script>

document.addEventListener('DOMContentLoaded', function() {
    var popup = document.getElementById('popup');
    var closeButton = document.querySelector('.close-button');

    // Show the pop-up after a delay (e.g., 3 seconds)
    setTimeout(function() {
        popup.style.display = 'flex';
    }, 3000);

    // Close the pop-up when the close button is clicked
    closeButton.addEventListener('click', function() {
        popup.style.display = 'none';
    });

    // Close the pop-up when clicking outside the content area
    window.addEventListener('click', function(event) {
        if (event.target === popup) {
            popup.style.display = 'none';
        }
    });
});

    </script>
</body>
</html>
