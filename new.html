<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .header {
            background-color: #b76a27;
            color: #fff;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header .logo {
            max-height: 50px;
            filter: brightness(0) invert(1);
        }

        .flag {
            height: 40px;
            margin-left: 10px;
            /* Adjust spacing between images */
        }

        .heading1 {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            font-size: 20px;
        }

        .flags-container {
            margin-right: 5%;

        }



        label span {
            color: brown;
        }



        .form-container {
            margin: 50px;
            margin-top: 3%;
            margin-left: 13%;
            max-width: 900px;
            /* background: #fff; */
            border: 1.5px solid #d68b49;
            padding: 10px;
            padding-left: 30px;
            padding-right: 40px;
            flex-grow: 1;
            /* padding-bottom: 20px; */
            /* border-radius: 8px; */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label,
        textarea,
        select {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input,
        textarea,
        select {
            width: 90%;
            padding: 8px;
            background-color: #f4f4f4;
            border: 1.3px solid #cecccc;
            border-radius: 10px;
        }

        .form-group checkbox input {
            margin-top: 2%;
        }

        .form-actions {
            margin-top: 20px;
        }

        .form-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            color: #fff;
            background-color: #b76a27;
            cursor: pointer;
        }

        .form-actions button.back {
            background-color: #6c757d;
        }

        .form-actions button:disabled {
            background-color: #ccc;
        }

        .image-container {
            position: sticky;
            margin-top: 3%;
            /* Adjust this value to control the vertical position */
            margin-right: 15%;
            /* Adjust this value if you need more space between form and image */
            max-width: 250px;
        }

        .image-container img {
            max-width: 350px;
            position: sticky;
            /* border-radius: 8px; */
        }

        .container {
            display: flex;
            justify-content: space-between;
            /* margin: 50px; */
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            margin-top: 2%;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
        }

        .error-message {
            color: rgb(213, 0, 0);
            font-size: 12px;
        }

        .header .heading1 {
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            font-size: 20px;
            margin: 0;
            text-align: center;
        }

        .room-container {
            margin-bottom: 20px;
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            border: 1px solid #e19405;
            border-radius: 5px;
        }
        .room-container h3{
            color: #b76a27;
            font-size: 20px;
        }
        

        .room-actions button {
            margin-top: 10px;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            color: #fff;
            background-color: #b76a27;
            cursor: pointer;
        }

        .room-actions button.remove-room {
            background-color: #d9534f;
        }

        .form-actions button.add-room {
            background-color: #5cb85c;
        }

        button.deleteRoomButton {
            /* margin-top: 10px; */
            background-color: #f44336;
            /* Red color for delete button */
            color: white;
            border: none;
            padding: 10px 10px;
            cursor: pointer;
            border-radius: 4px;
        }

        button.deleteRoomButton:hover {
            background-color: #d32f2f;
        }

        button.addroom {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button.addroom:hover {
            background-color: #179201;
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="logo1.png" alt="Logo" class="logo">
        <h4 class="heading1">Hotel Hype Listing Form!</h4>
        <div class="flags-container">
            <img src="icons8-pakistan-48.png" alt="Pakistan Flag" class="flag">
            <img src="icons8-account-50.png" alt="" class="flag">
        </div>
    </div>
    <div class="container">
        <div class="form-container">
            <form id="multiStepForm">
                <!-- Step 1 -->
                <div class="form-step active" id="step1">
                    <h4 class="heading">Get youself Registered!</h4>
                    <div class="form-group">
                        <label for="email">Email <span>*</span> </label>
                        <input type="email" id="email" name="email" placeholder="abc@gmail.con" required>
                        <div class="error-message" id="emailError"></div>
                    </div>
                    <div class="form-group">
                        <label for="password">Password <span>*</span></label>
                        <input type="password" id="password" name="password"
                            placeholder="Password must be strong(use special char)" required>
                        <div class="error-message" id="passwordError"></div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span>*</span></label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                        <div class="error-message" id="confirmPasswordError"></div>
                    </div>

                    <h4 class="heading">Enter Your Correct Address!</h4>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Full name" required>
                        <div class="error-message" id="nameError"></div>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" placeholder="enter your address" required>
                        <div class="error-message" id="addressError"></div>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="xxxxxxxxxx" required>
                        <div class="error-message" id="phoneError"></div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="back" onclick="prevStep()">Back</button>
                        <button type="button" onclick="nextStep()">Next</button>

                    </div>
                </div>

                <div class="form-step" id="step2">
                    <h4 class="heading">Enter Hotel Listing Data!</h4>
                    <div class="form-group">
                        <label for="hotelName">Hotel Name <span class="required-star">*</span></label>
                        <input type="text" id="hotelName" name="hotelName" placeholder="enter your hotel name" required>
                        <div class="error-message" id="hotelNameError"></div>
                    </div>
                    <div class="form-group">
                        <label for="hotelLocation">Hotel Location <span class="required-star">*</span></label>
                        <input type="text" id="hotelLocation" name="hotelLocation" placeholder="pin your hotel location"
                            required>
                        <div class="error-message" id="hotelLocationError"></div>
                    </div>
                    <div class="form-group">
                        <label for="price">Hotel Price<span class="required-star">*</span></label>
                        <input type="number" id="price" placeholder="Enter hotel price" required>
                        <div class="error-message" id="priceError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="googleMapLink">Google Map Link <span class="required-star">*</span></label>
                        <input type="url" id="googleMapLink" name="googleMapLink" placeholder="hotel map location"
                            required>
                        <div class="error-message" id="googleMapLinkError"></div>
                    </div>


                    <h4 class="heading">Fill The Hotel Location!</h4>
                    <div class="form-group">
                        <label for="city">City <span class="required-star">*</span></label>
                        <input type="text" id="city" name="city" placeholder="hotel city" required>
                        <div class="error-message" id="cityError"></div>
                    </div>
                    <div class="form-group">
                        <label for="ratingScore">Rating Score <span class="required-star">*</span></label>
                        <input type="number" id="ratingScore" name="ratingScore" min="0" max="5" step="0.1"
                            placeholder="rating value between 0-5" required>
                        <div class="error-message" id="ratingScoreError"></div>
                    </div>
                    <div class="form-group">
                        <label for="embeddedCode">Embedded Code from Google Map <span
                                class="required-star">*</span></label>
                        <textarea id="embeddedCode" name="embeddedCode" rows="4" required></textarea>
                        <div class="error-message" id="embeddedCodeError"></div>
                    </div>
                    <div class="form-group">
                        <label for="bedSize">Hotel Type <span class="required-star">*</span></label>
                        <select id="bedSize" name="bedSize" required>
                            <option value="single">5-Star </option>
                            <option value="double">4-Star</option>
                            <option value="extra-large">3-Star</option>
                        </select>
                        <div class="error-message" id="bedSizeError"></div>
                    </div>

                    <h4 class="heading">What's your hotel facilities!</h4>
                    <div class="form-group">
                        <label>Facilities <span class="required-star">*</span></label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="facilities" value="wifi"> WiFi</label>
                            <label><input type="checkbox" name="facilities" value="parking"> Parking</label>
                            <label><input type="checkbox" name="facilities" value="pool"> Pool</label>
                            <label><input type="checkbox" name="facilities" value="gym"> Gym</label>
                            <label><input type="checkbox" name="facilities" value="spa"> Spa</label>
                            <label><input type="checkbox" name="facilities" value="restaurant"> Restaurant</label>
                            <label><input type="checkbox" name="facilities" value="gym"> Gym</label>
                            <label><input type="checkbox" name="facilities" value="spa"> Spa</label>
                            <label><input type="checkbox" name="facilities" value="restaurant"> Restaurant</label>
                            <div class="error-message" id="checkboxErorr"></div>

                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="back" onclick="prevStep()">Back</button>
                        <button type="button" onclick="nextStep()">Next</button>
                    </div>
                </div>

                <div class="form-step" id="step3">
                    <h4 class="heading">Enter Hotel Room Details</h4>
                    <div id="roomsContainer">
                        <div class="room-container">
                            <div class="form-group">
                                <label for="roomName1">Room Name<span class="required-star">*</span></label>
                                <input type="text" id="roomName1" name="roomName[]" placeholder="Room name" required>
                            </div>
                            <div class="form-group">
                                <label for="roomDetails">Room Details <span class="required-star">*</span></label>
                                <textarea id="roomDetails" name="roomDetails" rows="4"
                                    placeholder="Enter room descrption" required></textarea>
                                <div class="error-message" id="roomDetailsError"></div>

                            </div>
                            <div class="form-group">
                                <label for="bedSize">Bed Size <span class="required-star">*</span></label>
                                <select id="bedSize" name="bedSize" required>
                                    <option value="single">Single Bed</option>
                                    <option value="double">Double Bed</option>
                                    <option value="extra-large">Extra Large Bed</option>
                                </select>
                                <div class="error-message" id="bedSizeError"></div>
                            </div>
                            <div class="form-group">
                                <label for="roomPrice1">Room Price<span class="required-star">*</span></label>
                                <input type="number" id="roomPrice1" name="roomPrice[]" placeholder="Room price"
                                    required>
                            </div>
                            <div class="form-group">
                                <label>Facilities <span class="required-star">*</span></label>
                                <div class="checkbox-group">
                                    <label><input type="checkbox" name="facilities" value="wifi"> WiFi</label>
                                    <label><input type="checkbox" name="facilities" value="parking"> Parking</label>
                                    <label><input type="checkbox" name="facilities" value="pool"> Pool</label>
                                    <label><input type="checkbox" name="facilities" value="gym"> Gym</label>
                                    <label><input type="checkbox" name="facilities" value="spa"> Spa</label>
                                    <label><input type="checkbox" name="facilities" value="restaurant">
                                        Restaurant</label>
                                    <label><input type="checkbox" name="facilities" value="gym"> Gym</label>
                                    <label><input type="checkbox" name="facilities" value="spa"> Spa</label>
                                    <label><input type="checkbox" name="facilities" value="restaurant">
                                        Restaurant</label>
                                    <div class="error-message" id="checkboxErorr"></div>

                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="addroom" onclick="addRoom()">Add Another Room</button>


                    <h4 class="heading">Include the hotels images!</h4>
                    <div class="form-group">
                        <label for="hotelImages">Hotel Images (up to 7) <span class="required-star">*</span></label>
                        <input type="file" id="hotelImages" name="hotelImages" accept="image/*" multiple required>
                        <div class="error-message" id="hotelImagesError"></div>
                    </div>
                    <div class="form-group">
                        <label for="hotelMainImage">Hotel Main Image <span class="required-star">*</span></label>
                        <input type="file" id="hotelMainImage" name="hotelMainImage" accept="image/*" required>
                        <div class="error-message" id="hotelMainImage"></div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="back" onclick="prevStep()">Back</button>
                        <button type="submit">Submit</button>
                    </div>
                </div>
        </div>
        </form>
        <div class="image-container">
            <img src="Yellow Simple Home Rules Poster.png" alt="Side Image">
        </div>

    </div>
    <script>
        let currentStep = 0;
        const formSteps = document.querySelectorAll(".form-step");

        // Show the initial step
        showStep(currentStep);

        function showStep(step) {
            formSteps.forEach((s, index) => {
                s.classList.toggle("active", index === step);
            });
        }

        function nextStep() {
            if (validateStep(currentStep)) {
                formSteps[currentStep].classList.remove("active");
                if (currentStep < formSteps.length - 1) {
                    currentStep++;
                }
                showStep(currentStep);

                if (currentStep >= formSteps.length) {
                    document.getElementById("multiStepForm").submit();
                }
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                formSteps[currentStep].classList.remove("active");
                currentStep--;
                showStep(currentStep);
            }
        }

        function validateForm() {
            return validateStep(currentStep);
        }

        function validateStep(step) {
            let isValid = true;
            const stepElement = formSteps[step];
            const inputs = stepElement.querySelectorAll("input[required], textarea[required], select[required]");

            inputs.forEach(input => {
                const errorElement = stepElement.querySelector(`#${input.id}Error`);
                if (!input.checkValidity()) {
                    errorElement.textContent = input.validationMessage;
                    isValid = false;
                } else {
                    // Additional validation for specific fields
                    switch (input.id) {
                        case "phone":
                            const phoneValue = input.value.replace(/\D/g, ''); // Remove non-numeric characters
                            if (phoneValue.length !== 11) {
                                errorElement.textContent = "Phone number must be exactly 11 digits.";
                                isValid = false;
                            } else {
                                errorElement.textContent = "";
                            }
                            break;
                        case "hotelImages":
                            const files = input.files;
                            if (files.length > 7) {
                                errorElement.textContent = "You can upload a maximum of 7 images.";
                                isValid = false;
                            } else {
                                errorElement.textContent = "";
                            }
                            break;
                        case "embeddedCode":
                            const embedCodeValue = input.value.trim();
                            const googleMapsRegex = /^https:\/\/www\.google\.com\/maps\/embed\?pb=/;
                            if (!googleMapsRegex.test(embedCodeValue)) {
                                errorElement.textContent = "Please enter a valid Google Maps embed code link.";
                                isValid = false;
                            } else {
                                errorElement.textContent = "";
                            }
                            break;
                        default:
                            errorElement.textContent = "";
                    }
                }
            });

            // Additional validation for password strength
            if (step === 0) {
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;

                if (!isValidPassword(password)) {
                    document.getElementById("passwordError").textContent = "Password must be at least 8 characters long, include at least one special character, one uppercase letter, one lowercase letter, and one digit.";
                    isValid = false;
                } else {
                    document.getElementById("passwordError").textContent = "";
                }

                if (password !== confirmPassword) {
                    document.getElementById("confirmPasswordError").textContent = "Passwords do not match.";
                    isValid = false;
                } else {
                    document.getElementById("confirmPasswordError").textContent = "";
                }
            }

            return isValid;
        }

        function isValidPassword(password) {
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&;:#.,/\^])[A-Za-z\d@$!%*?&;:#.,/\^]{8,}$/;
            return regex.test(password);
        }

        function togglePassword(fieldId) {
            const passwordField = document.getElementById(fieldId);
            const type = passwordField.getAttribute("type") === "password" ? "text" : "password";
            passwordField.setAttribute("type", type);
        }

        // Handle file input change event
        document.getElementById("hotelImages").addEventListener("change", function () {
            const files = this.files;
            const errorElement = document.getElementById("hotelImagesError");
            if (files.length > 7) {
                errorElement.textContent = "You can upload a maximum of 7 images.";
            } else {
                errorElement.textContent = "";
            }
        });

        // Add room functionality
        function addRoom() {
            const roomsContainer = document.getElementById('roomsContainer');
            const roomIndex = roomsContainer.querySelectorAll('.room-container').length + 1;
            const roomTemplate = `
        <div class="room-container">
            <div class="form-group">
                <h3>Add Another Room</h3>
                <label for="roomName${roomIndex}">Room Name<span class="required-star">*</span></label>
                <input type="text" id="roomName${roomIndex}" name="roomName[]" placeholder="Room name" required>
            </div>
            <div class="form-group">
                <label for="roomPrice${roomIndex}">Room Price<span class="required-star">*</span></label>
                <input type="number" id="roomPrice${roomIndex}" name="roomPrice[]" placeholder="Room price" required>
            </div>
            <div class="form-group">
                <label for="roomDetails${roomIndex}">Room Details <span class="required-star">*</span></label>
                <textarea id="roomDetails${roomIndex}" name="roomDetails[]" rows="4" placeholder="Enter room description" required></textarea>
                <div class="error-message" id="roomDetailsError"></div>
            </div>
            <div class="form-group">
                <label for="bedSize${roomIndex}">Bed Size <span class="required-star">*</span></label>
                <select id="bedSize${roomIndex}" name="bedSize[]" required>
                    <option value="single">Single Bed</option>
                    <option value="double">Double Bed</option>
                    <option value="extra-large">Extra Large Bed</option>
                </select>
                <div class="error-message" id="bedSizeError"></div>
            </div>
            <div class="form-group">
                <label>Facilities <span class="required-star">*</span></label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="facilities${roomIndex}[]" value="wifi"> WiFi</label>
                    <label><input type="checkbox" name="facilities${roomIndex}[]" value="parking"> Parking</label>
                    <label><input type="checkbox" name="facilities${roomIndex}[]" value="pool"> Pool</label>
                    <label><input type="checkbox" name="facilities${roomIndex}[]" value="gym"> Gym</label>
                    <label><input type="checkbox" name="facilities${roomIndex}[]" value="spa"> Spa</label>
                    <label><input type="checkbox" name="facilities${roomIndex}[]" value="restaurant"> Restaurant</label>
                    <div class="error-message" id="checkboxError"></div>
                </div>
            </div>
            <button type="button" class="deleteRoomButton" onclick="deleteRoom(this)">Delete Room</button>
        </div>
        <!-- Delete Room Button -->
        
    `; roomsContainer.insertAdjacentHTML('beforeend', roomTemplate);

        }
        function deleteRoom(button) {
            // Find the parent container of the button (the room container) and remove it
            const roomContainer = button.closest('.room-container');
            roomContainer.remove();
        }

        // Prevent form submission if validation fails
        document.getElementById("multiStepForm").addEventListener("submit", function (event) {
            if (!validateForm()) {
                event.preventDefault();
            }
        });


    </script>
</body>

</html>
